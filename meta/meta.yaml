# meta configuration for this stack. The database URL, the admin token, the
# secret key and the search engine come from the environment (compose.yaml,
# .env). Settings saved in meta's admin (clients, network profiles, the search
# engine, the decision model) live in its database.
listen: ":8901"
log:
  level: info
  format: text
providers:
  - id: mangabaka
    remote:
      url: http://meta-mangabaka:8903
      api_key: ${MANGABAKA_PLUGIN_KEY}
    settings:
      dump_variant: default
    schedules:
      # Daily at 03:00 UTC; MangaBaka rebuilds its dump at 00:00 UTC.
      dump: "0 3 * * *"
duplicates:
  # Find entries that are probably the same work, daily after the sync.
  schedule: "30 4 * * *"
